name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify demo artifacts
        run: pnpm verify:demo

      - name: Changeset status
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/main

      - name: Dist contract
        run: pnpm test:dist
