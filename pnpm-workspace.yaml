minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.10'
  - vue-tsc@3.3.10

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3

packages:
  - packages/**
  - examples

catalog:
  '@antfu/eslint-config': ^9.3.0
  '@changesets/changelog-github': ^1.0.0
  '@changesets/cli': ^3.0.0
  '@types/node': ^26.2.0
  '@types/throttle-debounce': ^5.0.2
  '@vitejs/plugin-vue': ^6.0.8
  '@vue/server-renderer': ^3.5.41
  '@vue/shared': ^3.5.41
  '@vue/test-utils': ^2.4.11
  '@vueuse/core': ^14.4.0
  cpy: ^13.2.2
  element-plus: ^2.14.4
  eslint: ^10.8.1
  fast-glob: ^3.3.3
  jsdom: ^30.0.1
  sass: ^1.102.0
  throttle-debounce: ^5.0.2
  typescript: 6.0.3
  unplugin-auto-import: ^21.1.0
  unplugin-dts: ^1.0.3
  unplugin-vue-components: ^32.1.0
  vite: ^8.2.1
  vitest: ^4.1.10
  vue: ^3.5.41
  vue-tsc: ^3.3.10

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - vue-demi

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
