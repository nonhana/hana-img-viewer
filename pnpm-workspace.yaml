  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^26.5.1
  '@types/throttle-debounce': ^5.0.2
  cpy: ^13.2.3
  eslint: ^10.10.0
  eslint-plugin-better-tailwindcss: ^4.7.0
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react-refresh: ^0.5.6
  fast-glob: ^3.3.3
