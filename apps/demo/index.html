<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hana-img-viewer · demos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Noto+Serif:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="/src/shared/app.css" />
  </head>
  <body>
    <main class="
      mx-auto flex min-h-screen max-w-5xl flex-col gap-14 px-6 pt-24 pb-16

      <header class="flex flex-col items-start gap-5">
        <h1 class="text-[clamp(40px,7vw,64px)] tracking-[-0.02em]">hana-img-viewer demos</h1>
        <p class="max-w-140 text-[17px]">

        <ul class="m-0 flex list-none flex-wrap gap-2 p-0">
          <li class="
            inline-block rounded-full border border-line bg-surface px-3 py-0.5
            font-mono text-[11px] tracking-[0.18em] whitespace-nowrap text-ink

          ">Vue 3 &amp; SSR</li>
          <li class="
            inline-block rounded-full border border-line bg-surface px-3 py-0.5
            font-mono text-[11px] tracking-[0.18em] whitespace-nowrap text-ink

        </ul>
      </header>
      <nav aria-label="Demo pages" class="grid grid-cols-1 gap-5 min-[641px]:grid-cols-2">
        <a

            motion-safe:transition-[transform,border-color,box-shadow]

            motion-safe:hover:-translate-y-0.5
            motion-safe:hover:border-hana-blue-200

            motion-safe:hover:-translate-y-0.5

          <span class="mt-auto pt-2 font-mono text-[13px] text-hana-blue">Open demo →</span>

        <a

          <h2 class="text-[24px]">Vue SSR</h2>
          <span class="mt-auto pt-2 font-mono text-[13px] text-hana-blue">Open demo →</span>
        </a>
        <a

        <a class="
          cursor-pointer
          bg-[linear-gradient(to_right,var(--color-hana-blue),var(--color-hana-blue))]
          bg-size-[0%_2px] bg-bottom-right bg-no-repeat text-hana-blue
          no-underline
          motion-safe:[transition:background-size_500ms_ease-out]
          motion-safe:hover:bg-size-[100%_2px] motion-safe:hover:bg-bottom-left
